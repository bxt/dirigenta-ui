name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6

      # Compile both architectures so a change that breaks the Intel (x86_64)
      # slice is caught here rather than at release time. Tests run on arm64
      # in the next step; this is purely a universal build check.
      - name: Build (universal)
        run: |
          set -o pipefail
          xcodebuild build \
            -project dirigenta-ui.xcodeproj \
            -scheme dirigenta-ui \
            -destination 'generic/platform=macOS' \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project dirigenta-ui.xcodeproj \
            -scheme dirigenta-ui \
            -destination 'platform=macOS,arch=arm64' \
            -skip-testing:dirigenta-uiTests/MDNSDiscoveryTests/testDiscoverHubOnLocalNetwork \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report html

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests.html
          archive: false
