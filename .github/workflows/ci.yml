name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project dirigenta-ui.xcodeproj \
            -scheme dirigenta-ui \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Unlock keychain for tests
        run: |
          # Allow unsigned test binaries to access the login Keychain without
          # prompting (headless CI runners block interactive auth dialogs).
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db
          security set-keychain-settings -t 3600 ~/Library/Keychains/login.keychain-db

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project dirigenta-ui.xcodeproj \
            -scheme dirigenta-ui \
            -destination 'platform=macOS,arch=arm64' \
            -skip-testing:dirigenta-uiTests/MDNSDiscoveryTests/testDiscoverHubOnLocalNetwork \
            -skip-testing:dirigenta-uiTests/AppStateCredentialInitTests/testInit_emptyHubs_whenStoreEmpty \
            -skip-testing:dirigenta-uiTests/AppStateCredentialInitTests/testInit_fallsBackToFirstHub_whenStoredSelectedHubIDStale \
            -skip-testing:dirigenta-uiTests/AppStateCredentialInitTests/testInit_readsHubsFromV2Store \
            -skip-testing:dirigenta-uiTests/AppStateCredentialInitTests/testInit_remembersSelectedHubID_whenStillPresent \
            -skip-testing:dirigenta-uiTests/AppStateMakeClientTests/testMakeClient_afterIPChange_newCallWithOldIPCreatesNewInstance \
            -skip-testing:dirigenta-uiTests/AppStateMakeClientTests/testMakeClient_switchingHub_evictsCache \
            -skip-testing:dirigenta-uiTests/MDNSDiscoveryTests/testIpForHub_ignoresLastKnownIP_whenNoLongerAdvertised \
            -skip-testing:dirigenta-uiTests/MDNSDiscoveryTests/testIpForHub_prefersLastKnownIP_whenStillAdvertised \
            -skip-testing:dirigenta-uiTests/MDNSDiscoveryTests/testIpForHub_returnsDemoSentinelForDemoHub \
            -skip-testing:dirigenta-uiTests/MDNSDiscoveryTests/testIpForHub_returnsMostRecentDiscovered_whenNoLastKnownIP \
            -skip-testing:dirigenta-uiTests/MDNSDiscoveryTests/testIpForHub_returnsNil_whenNoDiscoveredHubs \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report html

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests.html
          archive: false
